name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar projeto Flutter
        run: |
          rm -rf build_src
          mkdir build_src
          unzip -q rondas_prototipo_android_studio.zip -d build_src
          cd build_src
          rm -rf android
          flutter create --platforms=android .
          flutter pub get

      - name: Gerar APK
        working-directory: build_src
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: rondas-apk
          path: build_src/build/app/outputs/flutter-apk/app-release.apk
